<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrustLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #080b10;
      color: #e2e8f0;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 14px;
      border-bottom: 1px solid #131926;
    }

    .logo {
      display: flex; align-items: center; gap: 9px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .logo-version {
      font-size: 10px;
      color: #475569;
      font-family: 'Space Mono', monospace;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #131926;
      border-bottom: 1px solid #131926;
    }

    .stat-cell {
      background: #080b10;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #475569;
    }

    .stat-cell.real .stat-num { color: #22c55e; }
    .stat-cell.warn .stat-num { color: #f59e0b; }
    .stat-cell.fake .stat-num { color: #ef4444; }

    .section {
      padding: 16px 18px;
      border-bottom: 1px solid #131926;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle-label {
      font-size: 13px;
      color: #94a3b8;
    }

    .toggle {
      position: relative;
      width: 38px; height: 21px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: #1a2035;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track { background: #3b82f6; }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(17px);
    }

    .scan-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s;
    }

    .scan-btn:hover { opacity: 0.9; }
    .scan-btn:active { opacity: 0.8; }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #1a2035;
      border-radius: 8px;
      font-size: 11px;
      color: #64748b;
    }

    .api-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .api-dot.ok { background: #22c55e; }
    .api-dot.err { background: #ef4444; }

    .footer {
      padding: 10px 18px;
      text-align: center;
      font-size: 10px;
      color: #2d3748;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div>
        <div class="logo-text">TrustLens</div>
        <div class="logo-version">v1.0.0</div>
      </div>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <div class="stats-grid">
    <div class="stat-cell real">
      <div class="stat-num" id="stat-real">–</div>
      <div class="stat-label">Real</div>
    </div>
    <div class="stat-cell warn">
      <div class="stat-num" id="stat-warn">–</div>
      <div class="stat-label">Suspicious</div>
    </div>
    <div class="stat-cell fake">
      <div class="stat-num" id="stat-fake">–</div>
      <div class="stat-label">Flagged</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Controls</div>
    <div class="toggle-row">
      <span class="toggle-label">Show badges on images</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-badges" checked>
        <div class="toggle-track"></div>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto-scan on page load</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-auto" checked>
        <div class="toggle-track"></div>
      </label>
    </div>
    <button class="scan-btn" id="scan-btn">
      <span>⚡</span> Scan Page Now
    </button>
  </div>

  <div class="section">
    <div class="section-title">Backend API</div>
    <div class="api-status">
      <div class="api-dot" id="api-dot"></div>
      <span id="api-label">Checking connection…</span>
    </div>
  </div>

  <div class="footer">TrustLens · AI Image Authenticity · Anthropic API</div>

  <script src="js/popup.js"></script>
</body>
</html>
